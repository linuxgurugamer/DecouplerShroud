ShroudTexture {
	name = Corrugated
	v = 2

	outside {
		
		
		texture = _MainTex, DecouplerShroud/Textures/SurfCorrugated
		texture = _BumpMap, DecouplerShroud/Textures/SurfSaturnNor
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/SurfCorrugated_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/SurfCorrugated
			vector = _DiffuseNorm, 0.72, 0.72, 0.72, 0
		}

		uScale = 2
		autoScale = true
		autoHeightDivide = true
		autoMinUFactor = 0.5
	}
	top {

		MaterialVariant {
			shader = TU/Specular
			texture = _SpecGlossMap, DecouplerShroud/Textures/TopDot

			float = _Smoothness, .5
		}
		MaterialVariant {
			shader = KSP/Bumped Specular (Mapped)
			texture = _SpecMap, DecouplerShroud/Textures/TopDot
			float = _Shininess, .5

		}
		MaterialVariant {
			shader = KSP/Bumped Specular
			float = _Shininess, .5
		}

		texture = _MainTex, DecouplerShroud/Textures/TopDot
		texture = _BumpMap, DecouplerShroud/Textures/TopDotNor
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/TopDot_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/TopDot
			vector = _DiffuseNorm, 0.30, 0.30, 0.30, 0
		}

		uScale = 6
		vScale = 1
		autoScale = true
		autoHeightDivide = true
		autoWidthStep = 1

	}
	inside {
		MaterialVariant {
			shader = TU/Specular
			texture = _SpecGlossMap, DecouplerShroud/Textures/InTex

			float = _Smoothness, .4
		}
		MaterialVariant {
			shader = KSP/Bumped Specular
			float = _Shininess, .3
		}

		texture = _MainTex, DecouplerShroud/Textures/InTex
		texture = _BumpMap, DecouplerShroud/Textures/InNor
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/InTex_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/InTex
			vector = _DiffuseNorm, 0.37, 0.37, 0.37, 0
		}
		float = _Shininess, .3

		uScale = 3
		autoScale = true
	}
}
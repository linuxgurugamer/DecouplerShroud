ShroudTexture {
	name = Orange
	v = 2
	base = Corrugated

	outside {
		
		texture = _MainTex, DecouplerShroud/Textures/SurfOrange
		texture = _BumpMap, DecouplerShroud/Textures/SurfOrangeNor
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/SurfOrange_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/SurfOrange
			vector = _DiffuseNorm, 0.39, 0.39, 0.39, 0
		}

		vScale = 1
		uScale = 1
		autoScale = true
		autoMinUFactor = 1
		autoHeightDivide = true
	}
	//Pure primary mask: the top face follows the MAIN colour, just like the outside face
	top {
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/TopSolid_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/TopDot
			vector = _DiffuseNorm, 0.30, 0.30, 0.30, 0
		}
	}
	//Pure primary mask: the inside face follows the MAIN colour, just like the outside face
	inside {
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/InSolid_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/InTex
			vector = _DiffuseNorm, 0.37, 0.37, 0.37, 0
		}
	}
}
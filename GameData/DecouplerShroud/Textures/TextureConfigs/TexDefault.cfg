ShroudTexture {
	name = Default
	v = 2

	outside {
				
		texture = _MainTex, DecouplerShroud/Textures/SurfDefault
		texture = _BumpMap, DecouplerShroud/Textures/SurfDefaultNor
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/SurfDefault_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/SurfDefault
			vector = _DiffuseNorm, 0.71, 0.71, 0.71, 0
		}

		uScale = 2
		vScale = 1
		autoScale = true
		autoHeightDivide = true
		autoMinU = 1
	}
	top {

		MaterialVariant {
			shader = TU/Specular
			texture = _SpecGlossMap, DecouplerShroud/Textures/TopDefault

			float = _Smoothness, .5
		}
		MaterialVariant {
			shader = KSP/Bumped Specular (Mapped)
			texture = _SpecMap, DecouplerShroud/Textures/TopDefault
			float = _Shininess, .5
		}
		MaterialVariant {
			shader = KSP/Bumped Specular
			float = _Shininess, .5
		}

		texture = _MainTex, DecouplerShroud/Textures/TopDefault
		texture = _BumpMap, DecouplerShroud/Textures/TopDefaultNor
		//Pure primary mask: the top face follows the MAIN colour, just like the outside face
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/TopSolid_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/TopDefault
			vector = _DiffuseNorm, 0.16, 0.16, 0.16, 0
		}

		uScale = 2
		vScale = 1
		autoScale = true
		autoHeightDivide = true
		autoWidthStep = 1

	}
	inside {
		MaterialVariant {
			shader = TU/Specular
			texture = _SpecGlossMap, DecouplerShroud/Textures/InTex

			float = _Smoothness, .4
		}
		MaterialVariant {
			shader = KSP/Bumped Specular
			float = _Shininess, .2
		}

		texture = _MainTex, DecouplerShroud/Textures/InTex
		texture = _BumpMap, DecouplerShroud/Textures/InNor
		//Pure primary mask: the inside face follows the MAIN colour, just like the outside face
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/InSolid_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/InTex
			vector = _DiffuseNorm, 0.37, 0.37, 0.37, 0
		}
		float = _Shininess, .3

		uScale = 3
		autoScale = true
		autoWidthStep = .25
	}
}
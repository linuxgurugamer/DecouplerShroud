ShroudTexture {
	name = Dark
	v = 2
	base = Default

	outside {
		MaterialVariant {
			shader = TU/Specular
			texture = _SpecGlossMap, DecouplerShroud/Textures/SurfDark
		}
		texture = _MainTex, DecouplerShroud/Textures/SurfDark
		texture = _BumpMap, DecouplerShroud/Textures/SurfDefaultNor
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/SurfDark_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/SurfDark
			vector = _DiffuseNorm, 0.16, 0.16, 0.16, 0
		}
	}
	//Pure primary mask: the top face follows the MAIN colour, just like the outside face
	top {
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/TopSolid_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/TopDefault
			vector = _DiffuseNorm, 0.16, 0.16, 0.16, 0
		}
	}
	//Pure primary mask: the inside face follows the MAIN colour, just like the outside face
	inside {
		Recolor {
			texture = _MaskTex, DecouplerShroud/Textures/RGB/InSolid_RGB
			texture = _MetallicGlossMap, DecouplerShroud/Textures/InTex
			vector = _DiffuseNorm, 0.37, 0.37, 0.37, 0
		}
	}
}
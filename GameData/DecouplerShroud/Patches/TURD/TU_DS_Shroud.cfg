// ============================================================
// DecouplerShroud TURD - two recolour sections
//
// TURD shows one row per KSPTextureSwitch section in its
// "Part Recoloring" table, so the parts get up to two rows:
//
//   Shroud - data holder for the procedural shroud. Whether the
//            shroud is painted is chosen in the "Shroud Texture"
//            dropdown of ModuleDecouplerShroud (every texture is
//            offered with and without recolour), so this switch is
//            hidden from the PAW.
//   Ring   - a plain TURD recolour of the static "Circle" mesh,
//            which only the ShroudedDecoupler part has.
//
// Both switches have exactly one texture set, so there is nothing
// to choose in them; ModuleDecouplerShroud hides their PAW entries.
// ============================================================

// The shroud section goes on every part that carries the shroud
// module, so the recolour option works on stock decouplers too.
@PART[*]:HAS[@MODULE[ModuleDecouplerShroud]]:FOR[DecouplerShroud_TURD]:NEEDS[TexturesUnlimited]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Shroud
		currentTextureSet = DS_Shroud_Paint
		textureSet = DS_Shroud_Paint
	}

	%MODULE[SSTURecolorGUI]
	{
		%name = SSTURecolorGUI
	}
}

// The ring mesh ("Circle") only exists on the shrouded decoupler.
@PART[ShroudedDecoupler]:FOR[DecouplerShroud_TURD]:NEEDS[TexturesUnlimited]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Ring
		currentTextureSet = DS_Ring_Paint
		textureSet = DS_Ring_Paint
	}
}

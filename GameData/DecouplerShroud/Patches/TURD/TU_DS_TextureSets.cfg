// ============================================================
// DecouplerShroud TURD support - texture set templates
//
// Two recolour sections, i.e. two rows in TURD's "Part Recoloring" table:
//   Shroud -> the procedural shroud (painted by ModuleDecouplerShroud)
//   Ring   -> the static "Circle" mesh of the decoupler (native TURD)
// ============================================================

// ---- Section 1: shroud ---------------------------------------------------
// Pure colour data holder. The shroud meshes are generated at runtime by
// ModuleDecouplerShroud, which reads these colours back through
// IRecolorable.getSectionColors() and paints its own three materials
// (outside / top / inside) with them.
//
// The "mesh =" whitelist deliberately names a mesh that does not exist so
// Textures Unlimited never overwrites the shroud materials with its own -
// otherwise it would replace the per-surface masks the shroud relies on.
KSP_TEXTURE_SET:NEEDS[TexturesUnlimited]
{
	name = DS_Shroud_Paint
	title = DecouplerShroud
	recolorable = true

	MATERIAL
	{
		mode = create

		shader = TU/Metallic
		keyword = TU_RECOLOR

		mesh = DS_ProceduralShroud_NoMesh

		vector = _DiffuseNorm,0.75,0.75,0.75
		vector = _MetalNorm,0.5,0.5,0.5
		vector = _SmoothnessNorm,0.5,0.5,0.5

		texture = _MainTex,DecouplerShroud/Parts/DecouplerRing
	}

	// R = outside, G = top, B = inside. Same convention every TURD pack uses.
	COLORS
	{
		mainColor = absolute_red
		secondColor = absolute_green
		detailColor = absolute_blue
	}
}

// ---- Section 2: ring -----------------------------------------------------
// A normal TURD recolour of the decoupler's static ring mesh ("Circle").
// The mask is pure red, so the whole ring follows this section's Main colour.
KSP_TEXTURE_SET:NEEDS[TexturesUnlimited]
{
	name = DS_Ring_Paint
	title = DecouplerShroud Ring
	recolorable = true

	MATERIAL
	{
		mode = create

		shader = TU/Metallic
		keyword = TU_RECOLOR

		mesh = Circle

		// _DiffuseNorm is a guess for the ring texture's average brightness;
		// the other two match the generated DecouplerRing_Metal map.
		vector = _DiffuseNorm,0.5,0.5,0.5
		vector = _MetalNorm,0.16,0.16,0.16
		vector = _SmoothnessNorm,0.39,0.39,0.39

		texture = _MainTex,DecouplerShroud/Parts/DecouplerRing
		texture = _BumpMap,DecouplerShroud/Textures/RGB/DecouplerRing_Nor
		texture = _MetallicGlossMap,DecouplerShroud/Textures/RGB/DecouplerRing_Metal
		texture = _MaskTex,DecouplerShroud/Textures/RGB/DecouplerRing_RGB
	}

	// Neutral default so the ring keeps its stock look until the player picks
	// a colour, instead of defaulting to bright red.
	COLORS
	{
		mainColor = absolute_white
		secondColor = absolute_white
		detailColor = absolute_white
	}
}
